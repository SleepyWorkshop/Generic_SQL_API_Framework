# Production HTTPS template. Replace every REPLACE_WITH_* value before validation.
# Copy the four security-header examples to the matching /etc/nginx/snippets paths.

upstream generic_sql_api_php {
    server unix:/run/php/php-fpm.sock;
}

# Public HTTP endpoint: fixed-host redirect avoids reflecting an arbitrary Host header.
server {
    listen 80;
    server_name reports.example.internal;
    return 308 https://reports.example.internal$request_uri;
}

# Public reporting frontend and fixed API entry point.
server {
    listen 443 ssl;
    server_name reports.example.internal;
    root /srv/generic-reporting/Frontend/Generic-Reporting-Framework/dist;
    index index.html;
    include /etc/nginx/mime.types;
    include /etc/nginx/snippets/generic-sql-api-security-headers-frontend.conf;
    client_max_body_size 10m;

    ssl_certificate REPLACE_WITH_PUBLIC_CERTIFICATE_CHAIN_FILE;
    ssl_certificate_key REPLACE_WITH_PUBLIC_PRIVATE_KEY_FILE;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GenericSqlApiTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /api {
        include fastcgi_params;
        include /etc/nginx/snippets/generic-sql-api-security-headers-api.conf;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/api/index.php;
        fastcgi_param SCRIPT_NAME /api;
        fastcgi_param HTTPS on;
        fastcgi_param GENERIC_APP_ENV production;
    }

    location = /api/index.php {
        include fastcgi_params;
        include /etc/nginx/snippets/generic-sql-api-security-headers-api.conf;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param GENERIC_APP_ENV production;
    }

    location ~ ^/health/(?:live|ready)$ {
        include fastcgi_params;
        include /etc/nginx/snippets/generic-sql-api-security-headers-api.conf;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/api/health.php;
        fastcgi_param SCRIPT_NAME /health;
        fastcgi_param HTTPS on;
        fastcgi_param GENERIC_APP_ENV production;
    }

    location ^~ /api/ { return 404; }
    location ~* \.(?:bak|backup|old|tmp|log|lock|ini|sql)$ { deny all; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}

# Admin remains a separate loopback boundary. The certificate SAN must cover
# admin.example.internal and local DNS must resolve it to loopback.
server {
    listen 127.0.0.1:8090;
    listen [::1]:8090;
    server_name admin.example.internal;
    return 308 https://admin.example.internal:8443$request_uri;
}

server {
    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;
    server_name admin.example.internal;
    root /srv/generic-reporting/Backend/admin;
    include /etc/nginx/mime.types;
    include /etc/nginx/snippets/generic-sql-api-security-headers-admin.conf;
    client_max_body_size 10m;

    ssl_certificate REPLACE_WITH_ADMIN_CERTIFICATE_CHAIN_FILE;
    ssl_certificate_key REPLACE_WITH_ADMIN_PRIVATE_KEY_FILE;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GenericSqlAdminTLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    # The console, its assets, and its API share one public prefix. index.php
    # derives every URL from SCRIPT_NAME, so to mount Admin elsewhere replace
    # /admin/ in these locations and SCRIPT_NAME values consistently.
    absolute_redirect off;
    location = / { return 302 /admin/; }
    location = /admin { return 302 /admin/; }
    location = /admin/api.php {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/admin/api.php;
        fastcgi_param SCRIPT_NAME /admin/api.php;
        fastcgi_param HTTPS on;
        fastcgi_param GENERIC_APP_ENV production;
        fastcgi_param GENERIC_ADMIN_ENABLED 1;
    }
    location ^~ /admin/ {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/admin/index.php;
        fastcgi_param SCRIPT_NAME /admin/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param GENERIC_APP_ENV production;
        fastcgi_param GENERIC_ADMIN_ENABLED 1;
    }
    location = /admin/assets/admin.css { alias /srv/generic-reporting/Backend/admin/assets/admin.css; }
    location = /admin/assets/admin.js { alias /srv/generic-reporting/Backend/admin/assets/admin.js; }
    location = /admin/assets/service-controls.css { alias /srv/generic-reporting/Backend/admin/assets/service-controls.css; }
    location / { return 404; }
}

# SQL Parser remains independent and loopback-only by default.
server {
    listen 127.0.0.1:8101;
    listen [::1]:8101;
    server_name parser.example.internal;
    return 308 https://parser.example.internal:8444$request_uri;
}

server {
    listen 127.0.0.1:8444 ssl;
    listen [::1]:8444 ssl;
    server_name parser.example.internal;
    root /srv/generic-reporting/Backend/sqlparser;
    include /etc/nginx/mime.types;
    include /etc/nginx/snippets/generic-sql-api-security-headers-sqlparser.conf;
    client_max_body_size 10m;

    ssl_certificate REPLACE_WITH_PARSER_CERTIFICATE_CHAIN_FILE;
    ssl_certificate_key REPLACE_WITH_PARSER_PRIVATE_KEY_FILE;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GenericSqlParserTLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location = / {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/sqlparser/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param GENERIC_APP_ENV production;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/sqlparser/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param GENERIC_APP_ENV production;
    }
    location = /assets/css/app.css { try_files $uri =404; }
    location = /assets/js/app.js { try_files $uri =404; }
    location / { return 404; }
}
